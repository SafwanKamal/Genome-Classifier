name: Ethernet RX simulation
on:
  push:
    paths:
      - 'rtl/rmii_RX.sv'
      - 'rtl/ethernet_RX.sv'
      - 'rtl/ethernet_CRC32.sv'
      - 'simulation/ethernet_RX_tb.sv'
      - 'rtl/ethernet_request_RX.sv'
      - 'simulation/ethernet_request_RX_tb.sv'
      - 'rtl/ethernet_RX_test_top.sv'
      - 'software/send_ethernet_RX_test.py'
      - '.github/workflows/ethernet-rx.yml'
  pull_request:
    paths:
      - 'rtl/rmii_RX.sv'
      - 'rtl/ethernet_RX.sv'
      - 'rtl/ethernet_CRC32.sv'
      - 'simulation/ethernet_RX_tb.sv'
      - 'rtl/ethernet_request_RX.sv'
      - 'simulation/ethernet_request_RX_tb.sv'
      - 'rtl/ethernet_RX_test_top.sv'
      - 'software/send_ethernet_RX_test.py'
      - '.github/workflows/ethernet-rx.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Simulate raw Ethernet RX
        run: |
          iverilog -g2012 -s ethernet_RX_tb -o /tmp/ethernet_RX_tb.vvp \
            rtl/rmii_RX.sv rtl/ethernet_CRC32.sv rtl/ethernet_RX.sv \
            simulation/ethernet_RX_tb.sv
          vvp /tmp/ethernet_RX_tb.vvp
      - name: Simulate RX01 request parser
        run: |
          iverilog -g2012 -s ethernet_request_RX_tb -o /tmp/ethernet_request_RX_tb.vvp \
            rtl/ethernet_request_RX.sv simulation/ethernet_request_RX_tb.sv
          vvp /tmp/ethernet_request_RX_tb.vvp
      - name: Check known test-frame bytes
        run: |
          python software/send_ethernet_RX_test.py \
            --dry-run --source-mac 02:00:00:00:00:02
